name: Automatic APK Scanner on Issue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  scan-apk:
    if: contains(github.event.issue.body, 'http') || contains(github.event.issue.body, '.apk') || (github.event.comment != null && (contains(github.event.comment.body, 'http') || contains(github.event.comment.body, '.apk')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Issue Repository
        uses: actions/checkout@v4

      - name: Checkout ARIS Scanner (Repo 1)
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/ARIS' # Replace with your Repo 1 (owner/repo)
          token: ${{ secrets.ARIS_PAT }}
          path: 'aris-scanner'
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Extract APK URL
        id: extract_url
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import re, os, urllib.request, json

          def extract_apk_url(text):
              if not text:
                  return None
              apk_urls = re.findall(r'https?://[^\s\)]+?\.apk(?:\?[^\s\)]*)?', text, re.IGNORECASE)
              if apk_urls:
                  return apk_urls[0].rstrip(')]>\"\'.,;')

              asset_urls = re.findall(r'https?://github\.com/[^\s\)]+?/(?:files|assets|user-attachments/assets)/[^\s\)]+', text, re.IGNORECASE)
              if asset_urls:
                  return asset_urls[0].rstrip(')]>\"\'.,;')

              return None

          event_name = os.environ.get('EVENT_NAME', '')
          comment_body = os.environ.get('COMMENT_BODY', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          apk_url = extract_apk_url(comment_body if event_name == 'issue_comment' else issue_body)

          output_file = os.environ['GITHUB_OUTPUT']
          with open(output_file, 'a') as f:
              f.write(f'found={\"true\" if apk_url else \"false\"}\n')
              if apk_url:
                  f.write(f'apk_url={apk_url}\n')
          "

      - name: Download APK File
        if: success() && steps.extract_url.outputs.found == 'true'
        env:
          APK_URL: ${{ steps.extract_url.outputs.apk_url }}
        run: |
          curl -f -L -A "Mozilla/5.0" -o target_app.apk "$APK_URL"

      - name: Scan APK with ARIS
        if: success() && steps.extract_url.outputs.found == 'true'
        run: |
          mkdir -p scan_results
          cd aris-scanner
          ./gradlew :cli:run --args="scan-apk $PWD/../target_app.apk --store-json pretty --json pretty -o $PWD/../scan_results"

      - name: Generate Markdown Scan Report
        if: success() && steps.extract_url.outputs.found == 'true'
        run: |
          python3 -c "
          import json, glob, sys

          json_files = glob.glob('scan_results/*.json')
          if not json_files:
              sys.exit(1)

          with open(json_files[0], 'r') as f:
              data = json.load(f)

          sha256 = data.get('apkFileSha256', 'N/A')
          duration = data.get('scanDurationMs', 0)
          manifest_res = data.get('manifestCheckResult', {}) or {}
          manifest = manifest_res.get('manifest', {}) or {}

          app_label = manifest.get('label', '')
          app_id = manifest.get('appId', 'Unknown')
          version_name = manifest.get('versionName', 'N/A')
          version_code = manifest.get('versionCode', 'N/A')

          report = f'''## 🔍 ARIS APK Scan Results

          ### 📱 App Information
          - **App Name:** {app_label if app_label else 'N/A'}
          - **App ID (Package):** \`{app_id}\`
          - **Version:** {version_name} (Code: {version_code})
          - **File SHA-256:** \`{sha256}\`
          - **Scan Duration:** {duration} ms
          '''

          with open('comment_report.md', 'w') as f:
              f.write(report)
          "

      - name: Post Comment on Issue in Repo 2
        if: success() && steps.extract_url.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file comment_report.md
